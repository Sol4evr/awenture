name: AWenture quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: awenture-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore governed historical runtime cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/awenture-historical-corpus-v1
          key: awenture-historical-runtime-v1-${{ runner.os }}-node22
      - name: Gate LFS-free ordinary release architecture
        run: node tests/release-gate-lfs-budget.mjs
      - name: Run release gates
        run: npm run test:release
      - name: Confirm release evidence is absent from runtime artifact
        run: node scripts/prune-release-evidence.mjs
      - name: Bind tested artifact to workflow SHA
        run: printf '%s\n' "$GITHUB_SHA" > dist/.aw-tested-sha
      - name: Upload tested dist for independent browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: v6182-tested-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  legacy-browser:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: v6182-tested-dist
          path: dist
      - name: Verify tested artifact SHA
        run: test "$(cat dist/.aw-tested-sha)" = "$GITHUB_SHA"
      - run: npx playwright install --with-deps webkit chromium
      - name: Run v6.16.1 browser compatibility checks
        run: npx playwright test tests/v6161.spec.mjs
      - name: Upload legacy browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6161-browser-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

  full-browser:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: v6182-tested-dist
          path: dist
      - name: Verify tested artifact SHA
        run: test "$(cat dist/.aw-tested-sha)" = "$GITHUB_SHA"
      - run: npx playwright install --with-deps webkit chromium
      - name: Run full browser regression suite
        run: npm run test:browser
      - name: Upload full browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
