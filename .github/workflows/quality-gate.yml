name: AWenture quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS source assets
        run: |
          git lfs ls-files
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' source --include='*.pdf' | grep -q .; then
            echo 'One or more source PDFs are still Git LFS pointer files after checkout.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:release
      - run: npx playwright install --with-deps webkit chromium
      - name: Run v6.16.1 browser checks
        run: npx playwright test tests/v6161.spec.mjs
      - name: Browser regression · smoke
        run: npx playwright test tests/smoke.spec.mjs
      - name: Browser regression · v6.15
        run: npx playwright test tests/v615.spec.mjs
      - name: Browser regression · v6.15.2
        run: npx playwright test tests/v6152.spec.mjs
      - name: Browser regression · v6.15.3
        run: npx playwright test tests/v6153.spec.mjs
      - name: Browser regression · v6.16.0
        run: npx playwright test tests/v6160.spec.mjs
      - name: Browser regression · v6.16.1
        run: npx playwright test tests/v6161.spec.mjs
      - name: Browser regression · v6.17.0
        run: npx playwright test tests/v6170.spec.mjs
      - name: Browser regression · v6.17.1
        run: npx playwright test tests/v6171.spec.mjs
      - name: Browser regression · wide paper
        run: npx playwright test tests/wide-paper.spec.mjs
