name: AWenture quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:release
      - run: npx playwright install --with-deps webkit chromium
      - name: Run v6.16.1 browser checks
        run: npx playwright test tests/v6161.spec.mjs
      - name: Run full browser regression suite
        run: npm run test:browser
