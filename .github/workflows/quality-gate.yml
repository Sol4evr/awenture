name: AWenture quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS source assets
        run: |
          git lfs ls-files
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' source --include='*.pdf' | grep -q .; then
            echo 'One or more source PDFs are still Git LFS pointer files after checkout.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:release
      - run: npx playwright install --with-deps webkit chromium
      - name: Run v6.16.1 browser checks
        run: npx playwright test tests/v6161.spec.mjs
      - name: Run full browser regression suite
        run: npm run test:browser
