name: AWenture quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS source assets
        run: |
          git lfs ls-files
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' source --include='*.pdf' | grep -q .; then
            echo 'One or more source PDFs are still Git LFS pointer files after checkout.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Render private v6.18.2 visual review evidence
        env:
          AW_REVIEW_ARTIFACT: '1'
        run: node scripts/render-v6.18.2-companion-answer-review.mjs
      - name: Upload private v6.18.2 visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6182-companion-answer-review
          path: |
            dist/stage-papers/companion-answer-review/*.jpg
            dist/stage-papers/companion-answer-review/manifest.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:release
      - name: Render private unresolved question-count review batch
        env:
          AW_REVIEW_BATCH_SIZE: '8'
          AW_REVIEW_BATCH_OFFSET: '0'
        run: node scripts/render-v6.18.2-unresolved-review-batch.mjs
      - name: Upload private unresolved question-count review batch
        uses: actions/upload-artifact@v4
        with:
          name: v6182-unresolved-review-batch-0
          path: |
            dist/stage-papers/unresolved-review-batch/*.jpg
            dist/stage-papers/unresolved-review-batch/manifest.json
          if-no-files-found: error
          retention-days: 1
      - run: npx playwright install --with-deps webkit chromium
      - name: Run v6.16.1 browser checks
        run: npx playwright test tests/v6161.spec.mjs
      - name: Run full browser regression suite
        run: npm run test:browser
